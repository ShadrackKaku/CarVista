name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # NOTE: keep this job name EXACTLY as-is — branch protection requires a
    # status check named "Typecheck · Lint · Build". Renaming it leaves the
    # required check "Expected / waiting" forever and blocks merges. The Test
    # step below still runs; only the display name is intentionally stable.
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest

    env:
      # Dummy values so `prisma generate` and `next build` don't fail.
      # No real database is contacted — data pages are dynamic and are not
      # pre-rendered during the build.
      DATABASE_URL: "postgresql://user:password@localhost:5432/carvista?schema=public"
      NEXTAUTH_SECRET: "ci-placeholder-secret"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
